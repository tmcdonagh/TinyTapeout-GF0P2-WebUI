<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Tapeout GF0P2 Showcase</title>
    <style>
        :root {
            --bg: #111;
            --panel: #1a1a1a;
            --text: #eee;
            --accent: #0f0;
            --muted: #888;
            --danger: #f44;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .section:last-child {
            border-bottom: none;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        select, input[type="number"] {
            background: #222;
            border: 1px solid #444;
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 1rem;
        }
        select {
            width: 100%;
        }
        input[type="number"] {
            width: 100px;
        }
        button {
            background: #333;
            border: 1px solid #555;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        button:hover {
            background: #444;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        button.primary {
            background: #2a4;
            border-color: #4c6;
        }
        button.primary:hover {
            background: #3b5;
        }
        button.danger {
            background: #522;
            border-color: #844;
        }
        button.danger:hover {
            background: #633;
        }
        .presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .presets button {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .freq-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        .freq-display input {
            width: 120px;
        }
        .leds {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            margin-top: 10px;
        }
        .led {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .led-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #300;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
            transition: background 0.1s;
        }
        .led-dot.on {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        .led-label {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .status {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 4px;
        }
        .error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .frame-section {
            text-align: center;
        }
        .frame-section canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            border: 1px solid #444;
            border-radius: 6px;
            background: #000;
        }
        .capture-status {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 8px;
            min-height: 1.2em;
        }
        .gp-btn {
            touch-action: none;          /* pointer events, not page scroll */
            -webkit-user-select: none;
            user-select: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .widget-panel {
            margin-top: 10px;
        }
        .widget-group {
            margin-bottom: 16px;
        }
        .widget-group:last-child {
            margin-bottom: 0;
        }
        .widget-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .push-button {
            min-width: 70px;
        }
        .push-button.active {
            background: #2a4;
            border-color: #4c6;
        }
        .toggle-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .toggle-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }
        .seven-seg {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .seven-seg canvas {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .ws2812-strip {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .ws2812-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #222;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
        }
        .note {
            font-size: 0.8rem;
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tiny Tapeout GF0P2</h1>
        <div class="subtitle">Web Showcase Controller</div>

        <div class="section">
            <label>Project</label>
            <select id="projectSelect"></select>
            <div class="status" id="projectStatus">Current: —</div>
        </div>

        <div class="section">
            <label>Clock</label>
            <div class="freq-display">
                <span id="freqValue">0</span> Hz
                <button onclick="editFreq()">✎</button>
            </div>
            <div class="presets">
                <button onclick="setClock(10)">10 Hz</button>
                <button onclick="setClock(100)">100 Hz</button>
                <button onclick="setClock(1000)">1 kHz</button>
                <button onclick="setClock(10000)">10 kHz</button>
                <button onclick="setClock(100000)">100 kHz</button>
            </div>
            <div class="row" style="margin-top: 12px;">
                <button class="primary" id="runBtn" onclick="toggleClock()">Run</button>
                <button onclick="stepClock()">Step</button>
            </div>
            <div class="status" id="clockStatus">Stopped</div>
        </div>

        <div class="section" id="inputsSection" style="display:none;">
            <label>Project inputs</label>
            <div id="inputsPanel" class="widget-panel"></div>
        </div>

        <div class="section" id="outputsSection" style="display:none;">
            <label>Project outputs</label>
            <div id="outputsPanel" class="widget-panel"></div>
        </div>

        <div class="section frame-section" id="vgaSection" style="display:none;">
            <label>VGA frame</label>
            <canvas id="frameCanvas" width="320" height="240"></canvas>
            <div class="row" style="justify-content: center; margin-top: 12px;">
                <button class="primary" id="captureBtn" onclick="captureFrame()">Capture frame</button>
            </div>
            <div class="capture-status" id="captureStatus">Click to capture</div>
            <div class="row" id="captureRateRow" style="justify-content: center; margin-top: 8px; display:none;">
                <label for="captureRate" style="margin-right: 6px;">Capture clock</label>
                <select id="captureRate" onchange="setCaptureClock(this.value)">
                    <option value="1000000">1 MHz</option>
                    <option value="2000000">2 MHz</option>
                    <option value="4000000" selected>4 MHz</option>
                    <option value="8000000">8 MHz</option>
                    <option value="12500000">12.5 MHz</option>
                    <option value="25175000">25.175 MHz</option>
                </select>
            </div>
            <div id="gamepadPanel" style="display:none; margin-top: 10px; text-align: center;">
                <label>Virtual gamepad</label>
                <div style="display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 6px;">
                    <div style="display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px;">
                        <span></span>
                        <button data-gp="up" class="gp-btn">&#9650;</button>
                        <span></span>
                        <button data-gp="left" class="gp-btn">&#9664;</button>
                        <span></span>
                        <button data-gp="right" class="gp-btn">&#9654;</button>
                        <span></span>
                        <button data-gp="down" class="gp-btn">&#9660;</button>
                        <span></span>
                    </div>
                    <button data-gp="start" class="gp-btn" style="width: 64px; height: 44px;">Start</button>
                </div>
            </div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        let state = { project: 0, clock_running: false, clock_freq_hz: 0, uo_out: 0, ui_in: 0, uio_value: 0, uio_direction: 0, u_rst_n: false, frame_serial: 0, capture_state: 'idle', capture_row: -1, preview_row: 0, io_expander_present: false };
        let projectList = [];
        let currentDescriptor = null;
        let editingFreq = false;
        let rowsPainted = 0;
        let lastCaptureState = 'idle';
        let lastCaptureRow = -1;
        let frameSerialShown = 0;
        let capturedTimeText = '';
        let frameFetchInFlight = false;
        let previewRowShown = 0;

        // 2-bit per channel palette: index = --RRGGBB.
        const PALETTE = Array.from({length: 256}, (_, i) => {
            const r = (i >> 4) & 3, g = (i >> 2) & 3, b = i & 3;
            const e = [0, 85, 170, 255];
            return [e[r], e[g], e[b], 255];
        });

        async function loadProjects() {
            try {
                const res = await fetch('/api/projects');
                if (!res.ok) return;
                projectList = await res.json();
                const select = document.getElementById('projectSelect');
                select.innerHTML = '';
                for (const p of projectList) {
                    const opt = document.createElement('option');
                    opt.value = p.address;
                    opt.textContent = `${p.title} (${p.address})`;
                    select.appendChild(opt);
                }
                select.addEventListener('change', () => {
                    selectProject(parseInt(select.value, 10));
                });
            } catch (e) {
                console.error('loadProjects failed', e);
            }
        }

        async function loadDescriptor(address) {
            try {
                const res = await fetch('/api/project?address=' + address);
                if (!res.ok) {
                    currentDescriptor = null;
                    return;
                }
                currentDescriptor = await res.json();
                renderProjectWidgets();
            } catch (e) {
                console.error('loadDescriptor failed', e);
                currentDescriptor = null;
            }
        }

        function isBitAvailable(bit) {
            // All 8 ui_in bits are native GPIO on the Pico host.
            // (The ESP32 build omits ui_in_native; undefined -> old logic.)
            if (state.ui_in_native) return true;
            // Bits 0,1,4 are native; all bits are available if expander present.
            const nativeBits = {0: true, 1: true, 4: true};
            return state.io_expander_present || nativeBits[bit];
        }

        function renderProjectWidgets() {
            const inputsSection = document.getElementById('inputsSection');
            const outputsSection = document.getElementById('outputsSection');
            const vgaSection = document.getElementById('vgaSection');
            const inputsPanel = document.getElementById('inputsPanel');
            const outputsPanel = document.getElementById('outputsPanel');

            inputsPanel.innerHTML = '';
            outputsPanel.innerHTML = '';

            if (!currentDescriptor) {
                inputsSection.style.display = 'none';
                outputsSection.style.display = 'none';
                vgaSection.style.display = 'none';
                return;
            }

            const hasInputs = currentDescriptor.inputs && currentDescriptor.inputs.length > 0;
            const hasOutputs = currentDescriptor.outputs && currentDescriptor.outputs.length > 0;
            const hasVga = currentDescriptor.outputs && currentDescriptor.outputs.some(o => o.type === 'vga_canvas');

            inputsSection.style.display = hasInputs ? 'block' : 'none';
            outputsSection.style.display = hasOutputs ? 'block' : 'none';
            vgaSection.style.display = hasVga ? 'block' : 'none';

            if (hasInputs) {
                for (const input of currentDescriptor.inputs) {
                    renderInput(inputsPanel, input);
                }
            }

            if (hasOutputs) {
                for (const output of currentDescriptor.outputs) {
                    renderOutput(outputsPanel, output);
                }
            }
        }

        function renderInput(container, input) {
            const group = document.createElement('div');
            group.className = 'widget-group';

            const label = document.createElement('div');
            label.className = 'widget-label';
            label.textContent = input.label || input.id;
            group.appendChild(label);

            if (input.type === 'buttons') {
                const row = document.createElement('div');
                row.className = 'button-row';
                for (let i = 0; i < input.bits.length; i++) {
                    const bit = input.bits[i];
                    const btn = document.createElement('button');
                    btn.className = 'push-button';
                    btn.textContent = input.labels[i] || `bit ${bit}`;
                    btn.disabled = !isBitAvailable(bit);
                    btn.dataset.bit = bit;
                    btn.addEventListener('mousedown', () => pressButton(bit, true));
                    btn.addEventListener('mouseup', () => pressButton(bit, false));
                    btn.addEventListener('mouseleave', () => pressButton(bit, false));
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); pressButton(bit, true); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); pressButton(bit, false); });
                    row.appendChild(btn);
                }
                group.appendChild(row);
            } else if (input.type === 'toggle') {
                const row = document.createElement('div');
                row.className = 'toggle-row';
                const lbl = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = `input_${input.id}`;
                cb.disabled = !isBitAvailable(input.bit);
                cb.addEventListener('change', () => updateUiInBit(input.bit, cb.checked));
                lbl.appendChild(cb);
                lbl.appendChild(document.createTextNode(input.label || `bit ${input.bit}`));
                row.appendChild(lbl);
                group.appendChild(row);
            }

            container.appendChild(group);
        }

        function renderOutput(container, output) {
            const group = document.createElement('div');
            group.className = 'widget-group';

            if (output.type === 'leds') {
                const label = document.createElement('div');
                label.className = 'widget-label';
                label.textContent = 'LEDs';
                group.appendChild(label);
                const leds = document.createElement('div');
                leds.className = 'leds';
                for (let i = output.bits.length - 1; i >= 0; i--) {
                    const bit = output.bits[i];
                    const led = document.createElement('div');
                    led.className = 'led';
                    led.innerHTML = `<div class="led-dot" id="out_led_${bit}"></div><div class="led-label">${output.labels[i] || `[${bit}]`}</div>`;
                    leds.appendChild(led);
                }
                group.appendChild(leds);
            } else if (output.type === 'seven_seg') {
                const label = document.createElement('div');
                label.className = 'widget-label';
                label.textContent = 'Seven-segment display';
                group.appendChild(label);
                const wrap = document.createElement('div');
                wrap.className = 'seven-seg';
                wrap.id = 'seven_seg_display';
                for (let i = 0; i < (output.digits ? output.digits.length : 1); i++) {
                    const cvs = document.createElement('canvas');
                    cvs.width = 60;
                    cvs.height = 100;
                    cvs.id = `seven_seg_digit_${i}`;
                    wrap.appendChild(cvs);
                }
                group.appendChild(wrap);
            } else if (output.type === 'ws2812_strip') {
                const label = document.createElement('div');
                label.className = 'widget-label';
                label.textContent = 'WS2812 LED strip';
                group.appendChild(label);
                const note = document.createElement('div');
                note.className = 'note';
                note.textContent = 'Live decoding requires high-speed sampling (future work).';
                group.appendChild(note);
                const strip = document.createElement('div');
                strip.className = 'ws2812-strip';
                strip.id = 'ws2812_strip';
                const count = Math.min(output.led_count || 32, 64);
                for (let i = 0; i < count; i++) {
                    const led = document.createElement('div');
                    led.className = 'ws2812-led';
                    led.id = `ws2812_led_${i}`;
                    strip.appendChild(led);
                }
                group.appendChild(strip);
            }

            container.appendChild(group);
        }

        function drawSevenSeg(canvas, segments, inverted) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const pad = 8;
            const segW = 8;
            const onColor = inverted ? '#111' : '#0f0';
            const offColor = inverted ? '#0f0' : '#111';
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            ctx.lineCap = 'round';
            ctx.lineWidth = segW;

            const segDefs = {
                a: {x1: pad, y1: pad, x2: w - pad, y2: pad},
                b: {x1: w - pad, y1: pad, x2: w - pad, y2: h / 2 - pad / 2},
                c: {x1: w - pad, y1: h / 2 + pad / 2, x2: w - pad, y2: h - pad},
                d: {x1: pad, y1: h - pad, x2: w - pad, y2: h - pad},
                e: {x1: pad, y1: h / 2 + pad / 2, x2: pad, y2: h - pad},
                f: {x1: pad, y1: pad, x2: pad, y2: h / 2 - pad / 2},
                g: {x1: pad, y1: h / 2, x2: w - pad, y2: h / 2}
            };

            for (const [name, def] of Object.entries(segDefs)) {
                ctx.strokeStyle = segments[name] ? onColor : offColor;
                ctx.beginPath();
                ctx.moveTo(def.x1, def.y1);
                ctx.lineTo(def.x2, def.y2);
                ctx.stroke();
            }
        }

        function pressButton(bit, pressed) {
            let value = state.ui_in;
            if (pressed) {
                value |= (1 << bit);
            } else {
                value &= ~(1 << bit);
            }
            api('/api/ui_in', { ui_in: value });
        }

        function updateUiInBit(bit, checked) {
            let value = state.ui_in;
            if (checked) {
                value |= (1 << bit);
            } else {
                value &= ~(1 << bit);
            }
            api('/api/ui_in', { ui_in: value });
        }

        function paintFrame(bytes, startRow, preview = false) {
            const canvas = document.getElementById('frameCanvas');
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            if (preview) {
                const rowCount = Math.floor(bytes.length / 320);
                for (let i = 0; i < rowCount; i++) {
                    const canvasRow = rowsPainted % 240;
                    const srcOffset = i * 320;
                    const dstOffset = canvasRow * 320 * 4;
                    for (let col = 0; col < 320; col++) {
                        const idx = bytes[srcOffset + col];
                        const [rc, gc, bc, ac] = PALETTE[idx];
                        data[dstOffset + col * 4] = rc;
                        data[dstOffset + col * 4 + 1] = gc;
                        data[dstOffset + col * 4 + 2] = bc;
                        data[dstOffset + col * 4 + 3] = ac;
                    }
                    rowsPainted++;
                }
            } else {
                const totalRows = Math.min(240, startRow + Math.floor(bytes.length / 320));
                for (let row = startRow; row < totalRows; row++) {
                    const srcOffset = (row - startRow) * 320;
                    const dstOffset = row * 320 * 4;
                    for (let col = 0; col < 320; col++) {
                        const idx = bytes[srcOffset + col];
                        const [rc, gc, bc, ac] = PALETTE[idx];
                        data[dstOffset + col * 4] = rc;
                        data[dstOffset + col * 4 + 1] = gc;
                        data[dstOffset + col * 4 + 2] = bc;
                        data[dstOffset + col * 4 + 3] = ac;
                    }
                }
                rowsPainted = totalRows;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        async function refreshFrame(fullReset = false, preview = false) {
            if (frameFetchInFlight) return;
            frameFetchInFlight = true;
            const from = fullReset ? 0 : (preview ? (rowsPainted % 240) : rowsPainted);
            try {
                const res = await fetch('/api/frame_raw?from=' + from);
                if (!res.ok) return;
                const buf = await res.arrayBuffer();
                if (preview && (state.capture_state !== 'running' || state.capture_row >= 0)) {
                    return;
                }
                paintFrame(new Uint8Array(buf), from, preview);
                if (preview) {
                    previewRowShown = state.preview_row;
                }
            } catch (e) {
                console.error('refreshFrame failed', e);
            } finally {
                frameFetchInFlight = false;
            }
        }

        function maybeRefreshFrame() {
            const wasRunning = lastCaptureState === 'running';
            const isRunning = state.capture_state === 'running';
            const wasPreview = wasRunning && lastCaptureRow < 0;
            const isPreview = isRunning && state.capture_row < 0;
            const isAligned = isRunning && state.capture_row >= 0;

            if (isRunning && !wasRunning) {
                rowsPainted = 0;
                previewRowShown = 0;
            }
            if (wasPreview && isAligned) {
                rowsPainted = 0;
            }
            lastCaptureState = state.capture_state;
            lastCaptureRow = state.capture_row;

            let shouldFetch = false;
            let fullReset = false;
            let preview = false;
            if (state.frame_serial > 0 && state.frame_serial !== frameSerialShown) {
                shouldFetch = true;
                fullReset = true;
            }
            if (isAligned && state.capture_row > rowsPainted - 1) {
                shouldFetch = true;
            }
            if (isPreview && state.preview_row > previewRowShown) {
                shouldFetch = true;
                preview = true;
            }

            if (shouldFetch) {
                refreshFrame(fullReset, preview);
            }
        }

        function updateCaptureStatus() {
            const status = document.getElementById('captureStatus');
            if (state.capture_state === 'running') {
                if (state.capture_row < 0) {
                    if (state.preview_row > 0) {
                        status.textContent = 'syncing… (live preview)';
                    } else {
                        status.textContent = 'syncing…';
                    }
                } else {
                    const pct = Math.round(state.capture_row / 240 * 100);
                    status.textContent = `capturing… row ${state.capture_row}/240 (${pct}%)`;
                }
            } else if (state.capture_state === 'failed') {
                status.textContent = 'Capture failed';
            } else if ((state.capture_state === 'ok' || state.capture_state === 'idle') && state.frame_serial > 0) {
                if (state.frame_serial !== frameSerialShown) {
                    frameSerialShown = state.frame_serial;
                    capturedTimeText = new Date().toLocaleTimeString();
                }
                status.textContent = 'Captured ' + capturedTimeText;
            } else {
                status.textContent = 'Click to capture';
            }
        }

        async function captureFrame() {
            document.getElementById('error').textContent = '';
            try {
                if (state.project !== 33) {
                    await fetch('/api/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project: 33 }) });
                }
                if (state.u_rst_n === false) {
                    await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reset: false }) });
                }
                const res = await fetch('/api/capture', { method: 'POST' });
                if (res.status === 409) {
                    document.getElementById('captureStatus').textContent = 'Capture already in progress';
                } else if (!res.ok) {
                    document.getElementById('error').textContent = `Capture failed: ${res.status}`;
                }
            } catch (e) {
                document.getElementById('error').textContent = e.message;
            }
        }

        // ---- Project 33 virtual gamepad (Pico host: state.gamepad) ----
        const gamepadState = { start: false, up: false, down: false, left: false, right: false };

        async function postGamepad() {
            try {
                const res = await fetch('/api/gamepad', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(gamepadState) });
                if (!res.ok) throw new Error(res.status);
            } catch (e) {
                // A failed press post is retried by the next pointer event;
                // never surface as red error text for a demo toy.
                console.error('gamepad post failed', e);
            }
        }

        async function releaseAllGamepad() {
            for (const k of Object.keys(gamepadState)) gamepadState[k] = false;
            await postGamepad();
        }

        function initGamepad() {
            for (const btn of document.querySelectorAll('.gp-btn')) {
                const key = btn.dataset.gp;
                const press = (e) => {
                    e.preventDefault();
                    if (!gamepadState[key]) {
                        gamepadState[key] = true;
                        postGamepad();
                    }
                };
                const release = (e) => {
                    if (e) e.preventDefault();
                    if (gamepadState[key]) {
                        gamepadState[key] = false;
                        postGamepad();
                    }
                };
                btn.addEventListener('pointerdown', press);
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointerleave', release);
                btn.addEventListener('pointercancel', release);
            }
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) releaseAllGamepad();
            });
        }

        function setCaptureClock(hz) {
            api('/api/capture_clock', { hz: parseInt(hz, 10) });
        }

        async function api(path, body) {
            document.getElementById('error').textContent = '';
            try {
                const opts = body ? {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                } : {};
                const res = await fetch(path, opts);
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(`${res.status}: ${text}`);
                }
                state = { ...state, ...await res.json() };
                updateUi();
            } catch (e) {
                document.getElementById('error').textContent = e.message;
            }
        }

        function updateOutputWidgets() {
            if (!currentDescriptor || !currentDescriptor.outputs) return;

            for (const output of currentDescriptor.outputs) {
                if (output.type === 'leds') {
                    for (const bit of output.bits) {
                        const on = (state.uo_out >> bit) & 1;
                        const el = document.getElementById(`out_led_${bit}`);
                        if (el) el.classList.toggle('on', on);
                    }
                } else if (output.type === 'seven_seg') {
                    const segs = output.segments;
                    const segState = {};
                    for (const [name, src] of Object.entries(segs)) {
                        const [bus, idxStr] = src.split('.');
                        const idx = parseInt(idxStr, 10);
                        const value = bus === 'uio' ? state.uio_value : state.uo_out;
                        segState[name] = (value >> idx) & 1;
                    }
                    const inverted = ((state.ui_in >> 4) & 1) !== 0;
                    for (let i = 0; i < output.digits.length; i++) {
                        const selectSrc = output.digits[i].select;
                        const [bus, idxStr] = selectSrc.split('.');
                        const idx = parseInt(idxStr, 10);
                        const value = bus === 'uio' ? state.uio_value : state.uo_out;
                        const selected = (value >> idx) & 1;
                        const cvs = document.getElementById(`seven_seg_digit_${i}`);
                        if (cvs) {
                            drawSevenSeg(cvs, selected ? segState : {}, inverted);
                        }
                    }
                }
            }
        }

        function updateUi() {
            const select = document.getElementById('projectSelect');
            if (select.value !== String(state.project)) {
                select.value = state.project;
                loadDescriptor(state.project);
            }
            document.getElementById('projectStatus').textContent = `Current: ${state.project}`;

            if (!editingFreq) {
                document.getElementById('freqValue').textContent = state.clock_freq_hz.toLocaleString();
            }
            document.getElementById('runBtn').textContent = state.clock_running ? 'Stop' : 'Run';
            document.getElementById('clockStatus').textContent = state.clock_running ? 'Running' : 'Stopped';

            // Pico-only project 33 extras: degrade to hidden when the host
            // doesn't report them (ESP32 build).
            const is33 = state.project === 33;
            const rateRow = document.getElementById('captureRateRow');
            const rateSel = document.getElementById('captureRate');
            const showRate = is33 && state.capture_hz !== undefined;
            rateRow.style.display = showRate ? 'flex' : 'none';
            if (showRate && document.activeElement !== rateSel && rateSel.value !== String(state.capture_hz)) {
                rateSel.value = String(state.capture_hz);
            }
            document.getElementById('gamepadPanel').style.display =
                is33 && state.gamepad ? 'block' : 'none';

            updateOutputWidgets();
            maybeRefreshFrame();
            updateCaptureStatus();
        }

        function selectProject(project) {
            api('/api/select', { project });
        }

        function setClock(freq) {
            api('/api/clock', { running: true, freq_hz: freq });
        }

        function toggleClock() {
            api('/api/clock', { running: !state.clock_running, freq_hz: state.clock_freq_hz || 1000 });
        }

        function stepClock() {
            api('/api/step', {});
        }

        function editFreq() {
            if (editingFreq) return;
            editingFreq = true;
            const span = document.getElementById('freqValue');
            const current = state.clock_freq_hz || 1000;
            span.innerHTML = `<input type="number" id="freqInput" value="${current}" min="10" max="25000000">`;
            const input = document.getElementById('freqInput');
            input.focus();
            input.select();
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveFreq();
                if (e.key === 'Escape') { editingFreq = false; updateUi(); }
            });
            input.addEventListener('blur', saveFreq);
        }

        function saveFreq() {
            if (!editingFreq) return;
            const input = document.getElementById('freqInput');
            const freq = parseInt(input.value, 10);
            editingFreq = false;
            if (!isNaN(freq) && freq > 0) {
                api('/api/clock', { running: true, freq_hz: freq });
            } else {
                updateUi();
            }
        }

        loadProjects();
        initGamepad();
        api('/api/state');
        setInterval(() => api('/api/state'), 250);
    </script>
</body>
</html>
